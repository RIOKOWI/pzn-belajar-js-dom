<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" name="commentForm">
        <label for="comment">
            Comment : <input type="text" id="comment" name="comment">
        </label>
        <br>
        <label for="from">
            From : <input type="text" id="from" name="from">
        </label>
        <br>
        <input type="submit" value="Kirim">
    </form>
<div id="commentList">

</div>

<script>
    document.querySelector("form[name=commentForm]").onsubmit = function (event) { // ambil name form dan buat event
        event.preventDefault(); // agar bisa submit
            const commentList = document.getElementById("commentList"); // ambil id commentList
            const comment = document.getElementById("comment").value; // ambil value comment
            const from = document.getElementById("from").value; // ambil value from

            const commentItem = document.createElement("p"); // bikin element baru <p></p>
            commentItem.textContent = `${comment} - ${from}`; // ambil value dari variable comment dan from untuk di tampilkan di element baru
            commentList.appendChild(commentItem); // masukan <p> ke element <div>

            document.forms['commentForm'].reset(); // akses form via name
            
        }
    </script>
</body>
</html>
