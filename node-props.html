<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="parent">
        <li id="satu">1 jam</li>
        <li id="dua">pm</li>
        <li id="tiga">5 jam</li>
    </ul>
    <script>
        const node = document.getElementById("parent");
        console.info(node);
        console.info(node.childNodes); // ambil semua node di dalam parent
        
        const tengah = document.getElementById("dua");
        console.info(tengah.previousSibling); // ambil node sebelumnya "satu"
        console.info(tengah.textContent); // ambil valuenya
        console.info(tengah.nextSibling); // ambil node setelahnya "tiga"
    </script>
</body>
</html>
