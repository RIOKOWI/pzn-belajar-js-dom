<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="bigyo">
    <script>
        const id = document.getElementById("bigyo") // get id

        const src = document.createAttribute("src") // membuat attribute
        src.value = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7vKck83dWMGl2S4qyPzGURNKHNswdt4Cblw7GEarLOw&s=10" // nambahin value dari key src

        id.setAttributeNode(src); // menambahkan attribute ke element img

        // contoh = <img id="bigyo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7vKck83dWMGl2S4qyPzGURNKHNswdt4Cblw7GEarLOw&s=10">
    </script>
</body>
</html>
