<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- set warna -->
    <input type="button" value="red">
    <input type="button" value="yellow">
    <input type="button" value="blue">

    <!-- default warna kotak -->
    <div id="canvas" style="height: 500px; width: 500px; background-color: black;"></div>

    <script>
        const canvas = document.getElementById("canvas"); // ambil id default warna
        const colors = document.querySelectorAll("input"); // ambil seluruh element input

        for (let color of colors) { // perulangan untuk button
            color.onclick = function () {
                canvas.style.backgroundColor = color.getAttribute("value"); // implemen style dom sesuai dengan warna dari value
            }
        }
    </script>
</body>
</html>
