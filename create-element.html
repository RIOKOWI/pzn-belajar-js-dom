<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="content" class="content"></div>
    <script>
        const content = document.getElementById("content");

        const title = document.createElement("h1"); // membuat element baru
        title.textContent = "MAAFIN RESBOB"; // isi text ke element baru
        content.appendChild(title); // masukan element baru ke tag html yang sudah ada
        
        
        const desc = document.createElement("p"); // membuat element baru
        desc.textContent = "resbob keluar hari ini";// isi text ke element baru
        content.appendChild(desc);// masukan element baru ke tag html yang sudah ada
        
    </script>
</body>
</html>
