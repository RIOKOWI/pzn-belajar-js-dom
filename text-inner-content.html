<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="content">
        <script>
            console.info("Halo cok")
        </script>
        <b>Rio</b> Kowi <i>Achyar </i>
    </p>
    <script>
        const content = document.getElementById("content");
        console.info(content.textContent); // ambil semua text di element
        console.info(content.innerText); // ambil text saja
        console.info(content.innerHTML); // ambil semua element html
    </script>
</body>
</html>
